name: CI

# Checks on every push and pull request. On a push to main, and only once the repository
# variable DEPLOY_ENABLED is "true", the last job also updates the server (see DEPLOY.md).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # Not a `services:` container: those start before any step runs, so they could not get a
      # password made here. This one is random for each run, masked in the logs, and gone with the job.
      # (Hex, so it is safe inside a URL.)
      - name: Start Postgres with a one-time password
        run: |
          PASSWORD=$(openssl rand -hex 24)
          echo "::add-mask::$PASSWORD"
          docker run -d --name postgres -p 5432:5432 -e POSTGRES_USER=capsule -e POSTGRES_DB=capsule -e POSTGRES_PASSWORD="$PASSWORD" postgres:16-alpine
          # Over TCP: while it sets itself up the server only answers on its local socket
          for i in $(seq 1 30); do
            docker exec postgres pg_isready -h 127.0.0.1 -U capsule && break
            sleep 2
          done
          # The tests make and migrate their own capsule_test database next to this one
          echo "DATABASE_URL=postgresql+asyncpg://capsule:$PASSWORD@localhost:5432/capsule" >> "$GITHUB_ENV"
          echo "TEST_DATABASE_URL=postgresql+asyncpg://capsule:$PASSWORD@localhost:5432/capsule_test" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - run: python -m pytest -q
        working-directory: backend

  frontend:
    name: Web app build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      # Type-checks (tsc -b) and builds
      - run: npm run build
        working-directory: frontend

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t kelir:ci .

  deploy:
    name: Deploy to the server
    needs: [backend, frontend, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - name: Update the server over SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          SSH_TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # The key on the server is limited to one command (git pull, then docker compose up),
          # so the command given here is ignored.
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_TARGET" deploy
